spring.application.name=vernet

# Server
server.port=8080

# DB (dev)
spring.datasource.url=jdbc:postgresql://localhost:5432/vernet
spring.datasource.username=vernet
spring.datasource.password=vernet
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Douala

# Mail (dev placeholders)
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=change-me
spring.mail.password=change-me
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Feature flags
app.email.enabled=false

# JWT (DEV ONLY)
# IMPORTANT: change this secret before any real deployment.
app.jwt.secret=change-me-change-me-change-me-change-me-change-me-please
app.jwt.issuer=vernet
app.jwt.access-ttl-seconds=3600

