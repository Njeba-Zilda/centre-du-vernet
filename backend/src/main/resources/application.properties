spring.application.name=vernet

# Server
server.port=8080

# DB (dev local)
spring.datasource.url=jdbc:postgresql://localhost:5432/vernet
spring.datasource.username=vernet
spring.datasource.password=vernet
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Douala

# Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

# Mail (remplacer par les vraies valeurs en local ou utiliser application-local.properties)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USER:change-me}
spring.mail.password=${BREVO_KEY:change-me}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:change-me}
app.email.enabled=${EMAIL_ENABLED:false}

# Twilio WhatsApp
app.twilio.account-sid=${TWILIO_SID:change-me}
app.twilio.auth-token=${TWILIO_TOKEN:change-me}
app.twilio.whatsapp-from=${TWILIO_WHATSAPP:+14155238886}

# JWT (DEV ONLY — changer en production)
app.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-please}
app.jwt.issuer=vernet
app.jwt.access-ttl-seconds=86400
