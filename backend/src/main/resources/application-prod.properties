# Production — toutes les valeurs viennent des variables d'environnement Railway

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Douala

# Mail Brevo
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USER}
spring.mail.password=${BREVO_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM}
app.email.enabled=true

# Upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

# Twilio
app.twilio.account-sid=${TWILIO_SID}
app.twilio.auth-token=${TWILIO_TOKEN}
app.twilio.whatsapp-from=${TWILIO_WHATSAPP}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=vernet
app.jwt.access-ttl-seconds=86400

# Stockage fichiers
app.storage.dir=/app/storage

# CORS — remplacer par l'URL Vercel réelle
app.cors.allowed-origin=${FRONTEND_URL:https://votre-app.vercel.app}
